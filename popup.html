<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YapPilot</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="panel">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><svg viewBox="0 0 24 24"><path d="M21.5 2.5 2.9 10.6c-.9.4-.8 1.6.1 1.9l5.2 1.6 1.6 5.2c.3.9 1.5 1 1.9.1l8.1-18.6c.4-.8-.5-1.7-1.3-1.3ZM9.4 12.6l8.3-6.9-6.9 8.3-1.4-1.4Z"/></svg></span>
      <div>
        <h1>YapPilot</h1>
        <p>Your X engagement, on autopilot</p>
      </div>
    </div>
    <button id="topSettingsBtn" class="icon-btn" title="Settings"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.8 7.8 0 0 0 0-2l2.1-1.6a.5.5 0 0 0 .1-.6l-2-3.5a.5.5 0 0 0-.6-.2l-2.5 1a7.3 7.3 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4l-.4 2.6c-.6.3-1.2.6-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.5a.5.5 0 0 0 .1.6L4.6 11a7.8 7.8 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.6l2 3.5c.1.2.4.3.6.2l2.5-1c.5.4 1.1.7 1.7 1l.4 2.6c0 .2.2.4.5.4h4c.3 0 .5-.2.5-.4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.5a.5.5 0 0 0-.1-.6L19.4 13ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg></button>
  </header>

  <main class="main">

    <!-- Post URLs -->
    <section class="card">
      <div class="card-row">
        <label class="card-title" for="urls">Post URLs <span class="hint">(one per line)</span></label>
        <div class="row" style="gap:6px">
          <button id="viewFailedBtn" class="mini-btn hv-error" title="View failed posts"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 15h-2v-2h2v2Zm0-4h-2V7h2v6Z"/></svg></button>
          <button id="viewSuccessBtn" class="mini-btn hv-ok" title="View successful posts"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm-2 15-5-5 1.4-1.4L10 14.2l7.6-7.6L19 8l-9 9Z"/></svg></button>
          <button id="saveUrlsBtn" class="mini-btn hv-primary" title="Save URLs"><svg viewBox="0 0 24 24"><path d="M17 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7l-4-4Zm-5 16a3 3 0 1 1 0-6 3 3 0 0 1 0 6Zm3-10H7V5h8v4Z"/></svg></button>
        </div>
      </div>
      <textarea id="urls" placeholder="https://x.com/user/status/123456789&#10;https://x.com/user/status/987654321"></textarea>
    </section>

    <!-- Controls -->
    <section class="row">
      <button id="startBtn" class="btn btn-primary"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7L8 5Z"/></svg> Start</button>
      <button id="stopBtn" class="btn btn-danger" disabled><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6V6Z"/></svg> Stop</button>
      <button id="settingsBtn" class="btn btn-ghost"><svg viewBox="0 0 24 24"><path d="M3 17v2h6v-2H3ZM3 5v2h10V5H3Zm10 16v-2h8v-2h-8v-2h-2v6h2ZM7 9v2H3v2h4v2h2V9H7Zm14 4v-2H11v2h10Zm-6-4h2V7h4V5h-4V3h-2v6Z"/></svg> Settings</button>
    </section>

    <!-- AI Switcher -->
    <section class="card hidden" id="aiSwitcher">
      <div class="card-row">
        <span class="card-title">Active Model</span>
        <span class="chip chip-primary" id="currentModelDisplay">GROQ</span>
      </div>
      <div class="row">
        <select id="aiProviderSwitch">
          <option value="groq">GROQ (Llama)</option>
          <option value="gemini">Gemini</option>
          <option value="openrouter">OpenRouter</option>
        </select>
        <button id="switchAIBtn" class="btn btn-ghost btn-sm">Switch</button>
      </div>
    </section>

    <!-- Progress -->
    <section class="card hidden" id="progressSection">
      <div class="card-row">
        <span class="card-title">Progress</span>
        <span id="statusText" class="status-idle">Idle</span>
      </div>
      <div class="pbar"><div class="pbar-fill" id="progressFill"></div></div>
      <div class="mono-num" id="progressText">Processing 0/0</div>
    </section>

    <!-- Activity Log -->
    <section class="card log-card">
      <div class="log-head">
        <span class="card-title">Activity Log</span>
        <button id="clearLogBtn" class="text-btn">Clear</button>
      </div>
      <div id="logContainer" class="log-container">
        <div class="log-empty">
          <svg viewBox="0 0 24 24"><path d="M21.5 2.5 2.9 10.6c-.9.4-.8 1.6.1 1.9l5.2 1.6 1.6 5.2c.3.9 1.5 1 1.9.1l8.1-18.6c.4-.8-.5-1.7-1.3-1.3ZM9.4 12.6l8.3-6.9-6.9 8.3-1.4-1.4Z"/></svg>
          Idle. Add URLs to begin.
        </div>
      </div>
    </section>

  </main>
</div>
<script src="popup.js"></script>
</body>
</html>
