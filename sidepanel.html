<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YapPilot — Activity Log</title>
<link rel="stylesheet" href="popup.css">
</head>
<body class="sidepanel-page">
<div class="panel">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><svg viewBox="0 0 24 24"><path d="M21.5 2.5 2.9 10.6c-.9.4-.8 1.6.1 1.9l5.2 1.6 1.6 5.2c.3.9 1.5 1 1.9.1l8.1-18.6c.4-.8-.5-1.7-1.3-1.3ZM9.4 12.6l8.3-6.9-6.9 8.3-1.4-1.4Z"/></svg></span>
      <div>
        <h1>Activity Log</h1>
        <p>Live automation feed</p>
      </div>
    </div>
    <div class="row" style="gap:6px">
      <button id="exportBtn" class="mini-btn hv-primary" title="Export logs"><svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2ZM19 9h-4V3H9v6H5l7 7 7-7Z"/></svg></button>
      <button id="clearBtn" class="mini-btn hv-error" title="Clear logs"><svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12ZM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4Z"/></svg></button>
    </div>
  </header>

  <main class="main">

    <!-- Stat strip -->
    <section class="stat-strip">
      <div class="stat-cell is-ok">
        <span class="stat-cell-num" id="successCount">0</span>
        <span class="stat-cell-label">Success</span>
      </div>
      <div class="stat-cell is-err">
        <span class="stat-cell-num" id="failedCount">0</span>
        <span class="stat-cell-label">Failed</span>
      </div>
      <div class="stat-cell is-mute">
        <span class="stat-cell-num" id="skippedCount">0</span>
        <span class="stat-cell-label">Skipped</span>
      </div>
    </section>

    <!-- Filter -->
    <section class="card" style="padding:14px 16px">
      <div class="card-row">
        <span class="card-title"><svg viewBox="0 0 24 24"><path d="M3 5h2v2H3V5Zm4 0h14v2H7V5ZM3 11h2v2H3v-2Zm4 0h14v2H7v-2ZM3 17h2v2H3v-2Zm4 0h14v2H7v-2Z"/></svg> Filter</span>
        <select id="filterSelect" style="width:auto;min-width:150px">
          <option value="all">All activity</option>
          <option value="success">Success only</option>
          <option value="failed">Failed only</option>
          <option value="skipped">Skipped only</option>
        </select>
      </div>
    </section>

    <!-- Log feed -->
    <div id="logContainer" class="log-feed">
      <div class="empty-state">
        <svg viewBox="0 0 24 24"><path d="M21.5 2.5 2.9 10.6c-.9.4-.8 1.6.1 1.9l5.2 1.6 1.6 5.2c.3.9 1.5 1 1.9.1l8.1-18.6c.4-.8-.5-1.7-1.3-1.3ZM9.4 12.6l8.3-6.9-6.9 8.3-1.4-1.4Z"/></svg>
        <p>No activity yet</p>
        <small>Logs appear here while automation runs</small>
      </div>
    </div>

  </main>
</div>
<script src="sidepanel.js"></script>
</body>
</html>
