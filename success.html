<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YapPilot — Success Posts</title>
<link rel="stylesheet" href="popup.css">
</head>
<body class="success-page">
<div class="panel">
  <header class="topbar">
    <div class="brand">
      <button id="backBtn" class="icon-btn" title="Back"><svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20v-2Z"/></svg></button>
      <span class="topbar-title">Success Posts</span>
    </div>
  </header>

  <main class="main">
    <section class="stat-hero is-success">
      <span class="stat-icon"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm-2 15-5-5 1.4-1.4L10 14.2l7.6-7.6L19 8l-9 9Z"/></svg></span>
      <div class="stat-num" id="successCount">0</div>
      <div class="stat-label">Success</div>
    </section>

    <div class="action-grid cols-2">
      <button id="exportBtn" class="action-btn hv-primary"><svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2ZM19 9h-4V3H9v6H5l7 7 7-7Z"/></svg><span>Export</span></button>
      <button id="clearAllBtn" class="action-btn hv-error"><svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12ZM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4Z"/></svg><span>Clear All</span></button>
    </div>

    <div class="list-head">
      <h3>Recent Activity</h3>
    </div>

    <div id="successList" class="result-list">
      <div class="empty-state">
        <svg viewBox="0 0 24 24"><path d="M21.5 2.5 2.9 10.6c-.9.4-.8 1.6.1 1.9l5.2 1.6 1.6 5.2c.3.9 1.5 1 1.9.1l8.1-18.6c.4-.8-.5-1.7-1.3-1.3ZM9.4 12.6l8.3-6.9-6.9 8.3-1.4-1.4Z"/></svg>
        No successful posts yet.
      </div>
    </div>
  </main>
</div>
<script src="success.js"></script>
</body>
</html>
